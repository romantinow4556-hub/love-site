<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JS测试</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
    --pink-light: #ffe4ec; --pink-mid: #ffb6c1; --pink-dark: #ff69b4;
    --pink-deep: #e91e8c; --text-dark: #5a3e4b; --text-light: #8b6f7e; --white: #fff;
}
body {
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'SimSun', sans-serif;
    background: linear-gradient(135deg, #fff0f5, #ffe0eb, #ffd1dc, #ffe4ec);
    min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px;
}
.login-card {
    background: #fff; border-radius: 24px; padding: 48px 40px; max-width: 420px; width: 100%;
    text-align: center; box-shadow: 0 8px 40px rgba(233,30,140,0.15);
}
.login-card h2 { font-size: 2.2rem; color: var(--pink-deep); margin-bottom: 6px; }
.login-card .login-sub { font-size: 1.1rem; color: var(--text-light); margin-bottom: 28px; }
.login-card input {
    width: 100%; padding: 14px 18px; border: 2px solid var(--pink-light); border-radius: 14px;
    font-size: 1.05rem; color: var(--text-dark); background: var(--white); outline: none; margin-bottom: 14px;
}
.login-card input:focus { border-color: var(--pink-dark); }
.login-card .login-btn {
    width: 100%; padding: 14px; border: none; border-radius: 25px;
    background: linear-gradient(135deg,var(--pink-dark),var(--pink-deep)); color: var(--white);
    font-size: 1.1rem; font-weight: 700; cursor: pointer; margin-top: 6px;
}
.login-card .login-hint { margin-top: 18px; font-size: 0.85rem; color: var(--text-light); }
.login-error { color: #e53935; font-size: 0.9rem; margin-top: 8px; min-height: 20px; }
.login-recover { margin-top: 10px; font-size: 0.85rem; }
.login-recover a { color: var(--pink-dark); cursor: pointer; text-decoration: underline; }
#debug-log { position: fixed; top: 0; left: 0; right: 0; background: #333; color: #0f0; font-family: monospace; font-size: 12px; padding: 8px; z-index: 99999; max-height: 200px; overflow-y: auto; }
</style>
</head>
<body>

<div id="debug-log">调试日志：</div>

<div id="login-page">
    <div class="login-card">
        <div style="font-size:4rem;margin-bottom:12px;">💕</div>
        <h2>我们的小屋</h2>
        <div class="login-sub">Enter our love space</div>
        <input type="text" id="loginUser" placeholder="你的名字" maxlength="20">
        <input type="password" id="loginPass" placeholder="房间密码" maxlength="50">
        <input type="text" id="loginCode" placeholder="邀请码" maxlength="50">
        <div class="login-error" id="loginError"></div>
        <button class="login-btn" id="loginBtn" onclick="doLogin()">💕 进入我们的小屋</button>
        <div class="login-hint">💡 输入邀请码和房间密码，开启属于你们的空间</div>
        <div class="login-recover"><a onclick="openRecover()">🔑 找回账号</a></div>
    </div>
</div>

<div id="main-page" style="display:none;">
    <div id="loading-screen" style="position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#fff0f5,#ffe0eb,#ffd1dc);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:10000;">
        <div style="font-size:2.5rem;color:#ff69b4;">Loading our story...</div>
        <div style="display:flex;gap:12px;margin-top:20px;"><span style="font-size:1.8rem;">💕</span><span style="font-size:1.8rem;">💗</span><span style="font-size:1.8rem;">💕</span></div>
    </div>
    <div style="padding:60px 20px;text-align:center;">
        <h1 style="color:#e91e8c;font-size:3rem;">登录成功！</h1>
        <p style="color:#8b6f7e;font-size:1.2rem;margin-top:10px;">欢迎来到你们的小屋 💕</p>
        <button onclick="doLogout()" style="margin-top:20px;padding:10px 24px;border:2px solid #ff69b4;border-radius:25px;background:#fff;color:#ff69b4;font-size:1rem;cursor:pointer;">退出登录</button>
    </div>
</div>

<script>
var debugEl = document.getElementById('debug-log');
function log(msg) {
    debugEl.innerHTML += '<br>' + msg;
    console.log(msg);
}

try {
    log('1. 脚本开始执行');

    var storagePrefix = '';
    var _vc = ['zhangandcheng'];
    function _ck(c) { return _vc.indexOf(c) !== -1; }

    log('2. 变量定义完成');

    function doLogin() {
        log('doLogin 被调用');
        var user = document.getElementById('loginUser').value.trim();
        var pass = document.getElementById('loginPass').value.trim();
        var code = document.getElementById('loginCode').value.trim();
        if (!user) { document.getElementById('loginError').textContent = '请输入你的名字'; return; }
        if (!pass) { document.getElementById('loginError').textContent = '请输入房间密码'; return; }
        if (!code) { document.getElementById('loginError').textContent = '请输入邀请码'; return; }
        if (!_ck(code)) { document.getElementById('loginError').textContent = '邀请码无效'; return; }
        storagePrefix = 'love_data_' + pass + '_';
        localStorage.setItem('lastLoginUser', user);
        localStorage.setItem('lastLoginPass', pass);
        localStorage.setItem('lastLoginCode', code);
        document.getElementById('login-page').style.display = 'none';
        document.getElementById('main-page').style.display = 'block';
        setTimeout(function () {
            document.getElementById('loading-screen').style.display = 'none';
            log('Loading 隐藏完成');
        }, 1800);
        log('登录成功');
    }

    function doLogout() {
        storagePrefix = '';
        document.getElementById('main-page').style.display = 'none';
        document.getElementById('login-page').style.display = 'flex';
        document.getElementById('loginError').textContent = '';
        log('已退出登录');
    }

    log('3. 函数定义完成');

    // 自动登录
    log('4. 开始自动登录检查');
    var lastUser = localStorage.getItem('lastLoginUser');
    var lastPass = localStorage.getItem('lastLoginPass');
    var lastCode = localStorage.getItem('lastLoginCode');
    log('lastUser=' + lastUser + ', lastPass=' + lastPass + ', lastCode=' + lastCode);

    if (lastUser) document.getElementById('loginUser').value = lastUser;
    if (lastPass) document.getElementById('loginPass').value = lastPass;
    if (lastCode) document.getElementById('loginCode').value = lastCode;

    if (lastUser && lastPass && lastCode && _ck(lastCode)) {
        log('5. 自动登录条件满足，执行自动登录');
        storagePrefix = 'love_data_' + lastPass + '_';
        document.getElementById('login-page').style.display = 'none';
        document.getElementById('main-page').style.display = 'block';
        setTimeout(function () {
            document.getElementById('loading-screen').style.display = 'none';
            log('自动登录 Loading 隐藏完成');
        }, 1800);
    } else {
        log('5. 不满足自动登录条件，显示登录页');
    }

    log('6. 脚本执行完成');

} catch (e) {
    log('❌ 错误: ' + e.message + ' (行: ' + (e.lineNumber || '未知') + ')');
}
</script>
</body>
</html>
