<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我们的故事 💕</title>
<style>
/* ============ 基础样式 & 重置 ============ */
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
    --pink-light: #ffe4ec; --pink-mid: #ffb6c1; --pink-dark: #ff69b4;
    --pink-deep: #e91e8c; --gold: #d4a857; --cream: #fff8f0;
    --text-dark: #5a3e4b; --text-light: #8b6f7e; --white: #fff;
    --shadow: 0 4px 20px rgba(233,30,140,0.15);
    --shadow-sm: 0 2px 12px rgba(0,0,0,0.06);
    --radius: 16px;
}
html { scroll-behavior: smooth; }
body {
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'SimSun', sans-serif;
    background: linear-gradient(180deg, #fff0f5, #ffe4ec, #ffd6e0, #ffe4ec, #fff0f5);
    color: var(--text-dark); overflow-x: hidden; min-height: 100vh;
}

/* ============ Loading ============ */
#loading-screen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(135deg, #fff0f5, #ffe0eb, #ffd1dc);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    z-index: 10000; transition: opacity 0.8s, visibility 0.8s;
}
#loading-screen.hidden { opacity: 0; visibility: hidden; }
#loading-screen .loading-text { font-family: 'KaiTi', 'STKaiti', 'SimSun', serif; font-size: 2.5rem; color: var(--pink-dark); margin-bottom: 30px; animation: pulse 1.5s ease-in-out infinite; }
#loading-screen .loading-hearts { display: flex; gap: 12px; }
#loading-screen .loading-hearts span { font-size: 1.8rem; animation: heartBounce 1.4s ease-in-out infinite; }
#loading-screen .loading-hearts span:nth-child(2) { animation-delay: 0.2s; }
#loading-screen .loading-hearts span:nth-child(3) { animation-delay: 0.4s; }
@keyframes heartBounce { 0%,80%,100%{transform:scale(1) translateY(0)} 40%{transform:scale(1.3) translateY(-15px)} }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

/* ============ 鼠标跟随 & 飘落 ============ */
.cursor-heart { position: fixed; pointer-events: none; font-size: 1rem; z-index: 9999; animation: cursorFade 1s ease-out forwards; }
@keyframes cursorFade { 0%{opacity:1;transform:translate(0,0) scale(1) rotate(0)} 100%{opacity:0;transform:translate(0,-60px) scale(0.3) rotate(45deg)} }
.falling-petal { position: fixed; top: -40px; pointer-events: none; z-index: 2; animation: petalFall linear forwards; font-size: 1.2rem; }
@keyframes petalFall { 0%{opacity:1;transform:translateY(0) rotate(0) translateX(0)} 25%{transform:translateY(25vh) rotate(90deg) translateX(30px)} 50%{transform:translateY(50vh) rotate(180deg) translateX(-20px)} 75%{transform:translateY(75vh) rotate(270deg) translateX(25px)} 100%{opacity:0.3;transform:translateY(105vh) rotate(360deg) translateX(-10px)} }

/* ============ 导航栏 ============ */
nav {
    position: fixed; top: 0; left: 0; width: 100%; padding: 12px 20px;
    background: rgba(255,240,245,0.9); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    z-index: 1000; display: flex; justify-content: space-between; align-items: center;
    box-shadow: 0 2px 15px rgba(233,30,140,0.08); transition: transform 0.3s;
}
nav .nav-logo { font-family: 'KaiTi', 'STKaiti', 'SimSun', serif; font-size: 1.5rem; color: var(--pink-deep); text-decoration: none; white-space: nowrap; }
nav .nav-links { display: flex; gap: 6px; list-style: none; flex-wrap: wrap; justify-content: center; }
nav .nav-links a {
    text-decoration: none; font-size: 0.9rem; padding: 6px 12px; border-radius: 20px;
    font-weight: 600; transition: all 0.3s; white-space: nowrap;
}
nav .nav-links a:hover { transform: translateY(-1px) scale(1.05); }
.nav-story { background: linear-gradient(135deg,#ff9a9e,#fad0c4); color: #7a3b2e; box-shadow: 0 2px 8px rgba(255,154,158,0.3); }
.nav-gallery { background: linear-gradient(135deg,#a18cd1,#fbc2eb); color: #4a2d6b; box-shadow: 0 2px 8px rgba(161,140,209,0.3); }
.nav-countdown { background: linear-gradient(135deg,#f6d365,#fda085); color: #7a4a1e; box-shadow: 0 2px 8px rgba(253,160,133,0.3); }
.nav-diary { background: linear-gradient(135deg,#84fab0,#8fd3f4); color: #1a5c4a; box-shadow: 0 2px 8px rgba(132,250,176,0.3); }
.nav-dream { background: linear-gradient(135deg,#c3cfe2,#f5f7fa); color: #4a5568; box-shadow: 0 2px 8px rgba(195,207,226,0.3); }
.nav-hobby { background: linear-gradient(135deg,#ffecd2,#fcb69f); color: #7a4a1e; box-shadow: 0 2px 8px rgba(252,182,159,0.3); }
.nav-guestbook { background: linear-gradient(135deg,#a1c4fd,#c2e9fb); color: #2d4a7a; box-shadow: 0 2px 8px rgba(161,196,253,0.3); }
.nav-period { background: linear-gradient(135deg,#f093fb,#f5576c); color: #fff; box-shadow: 0 2px 8px rgba(240,147,251,0.3); }
.nav-bind { background: linear-gradient(135deg,#667eea,#764ba2); color: #fff; box-shadow: 0 2px 8px rgba(102,126,234,0.3); }
.hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; background: none; border: none; padding: 4px; }
.hamburger span { width: 24px; height: 2.5px; background: var(--pink-deep); border-radius: 2px; transition: all 0.3s; }

/* ============ 主容器 ============ */
.main-container { max-width: 960px; margin: 0 auto; padding: 90px 20px 40px; }
.section { padding: 50px 0; }
.section-title { text-align: center; font-family: 'KaiTi', 'STKaiti', 'SimSun', serif; font-size: 3rem; color: var(--pink-deep); margin-bottom: 10px; }
.section-subtitle { text-align: center; font-family: 'KaiTi', 'STKaiti', 'SimSun', serif; font-size: 1.3rem; color: var(--text-light); margin-bottom: 40px; }

/* ============ Hero ============ */
.hero {
    text-align: center; padding: 60px 20px; position: relative;
    background: linear-gradient(135deg, rgba(255,105,180,0.08), rgba(233,30,140,0.05));
    border-radius: 30px; margin-bottom: 40px; overflow: hidden;
}
.hero-decoration { position: absolute; font-size: 15rem; opacity: 0.04; color: var(--pink-deep); top: 50%; left: 50%; transform: translate(-50%,-50%); pointer-events: none; }
.hero .subtitle-top { font-family: 'KaiTi', 'STKaiti', 'SimSun', serif; font-size: 1.6rem; color: var(--pink-dark); margin-bottom: 10px; letter-spacing: 2px; }
.hero h1 { font-family: 'KaiTi', 'STKaiti', 'SimSun', serif; font-size: 4.8rem; color: var(--pink-deep); margin-bottom: 15px; text-shadow: 0 2px 10px rgba(233,30,140,0.2); }
.hero .couple-names { font-family: 'KaiTi', 'STKaiti', 'SimSun', serif; font-size: 2.6rem; color: var(--gold); margin-bottom: 20px; }
.hero .together-time { font-size: 1.2rem; color: var(--text-light); margin-bottom: 30px; }
#togetherTimer { font-size: 1.5rem; font-weight: 700; color: var(--pink-deep); }

/* ============ 仪表盘 ============ */
.dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap: 20px; margin-bottom: 30px; }
.dash-card { background: rgba(255,255,255,0.85); border-radius: 18px; padding: 24px; text-align: center; box-shadow: var(--shadow-sm); transition: transform 0.3s; }
.dash-card:hover { transform: translateY(-4px); }
.dash-card .dash-icon { font-size: 2.2rem; margin-bottom: 8px; }
.dash-card .dash-label { font-size: 0.9rem; color: var(--text-light); margin-bottom: 4px; }
.dash-date-card .today-date { font-family: 'KaiTi', 'STKaiti', 'SimSun', serif; font-size: 2.4rem; color: var(--pink-deep); }
.dash-date-card .today-solar { font-size: 0.9rem; color: var(--text-light); }
.dash-next-anniv .anniv-name { font-size: 1rem; color: var(--text-dark); margin-bottom: 4px; }
.dash-next-anniv .anniv-days { font-family: 'KaiTi', 'STKaiti', 'SimSun', serif; font-size: 3.5rem; color: var(--pink-deep); line-height: 1; }
.dash-next-anniv .anniv-unit { font-size: 0.85rem; color: var(--text-light); }

/* ============ 便签 ============ */
.quick-notes { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: 14px; margin-bottom: 20px; }
.qn-card { background: var(--cream); border-radius: 14px; padding: 16px; box-shadow: var(--shadow-sm); position: relative; transition: all 0.3s; }
.qn-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.qn-card .qn-text { font-size: 1rem; color: var(--text-dark); line-height: 1.5; min-height: 40px; outline: none; word-break: break-all; }
.qn-card .qn-date { font-size: 0.85rem; color: var(--text-light); margin-bottom: 3px; }
.qn-card .qn-actions { position: absolute; top: 8px; right: 8px; display: none; gap: 4px; }
.qn-card:hover .qn-actions { display: flex; }
.qn-card .qn-actions button { background: rgba(255,255,255,0.8); border: 1px solid #eee; border-radius: 8px; padding: 2px 8px; font-size: 0.75rem; cursor: pointer; }
.qn-add { background: rgba(255,255,255,0.5); border: 2px dashed var(--pink-mid); border-radius: 14px; padding: 16px; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 1.5rem; color: var(--pink-mid); transition: all 0.3s; min-height: 80px; }
.qn-add:hover { background: rgba(255,255,255,0.8); border-color: var(--pink-dark); color: var(--pink-dark); }

/* ============ 恋爱小贴士 ============ */
.love-tips { position: relative; }
.tip-card { background: rgba(255,255,255,0.85); border-radius: 18px; padding: 24px 28px; box-shadow: var(--shadow-sm); margin-bottom: 14px; display: flex; align-items: center; gap: 14px; transition: all 0.4s; }
.tip-card .tip-icon { font-size: 2rem; flex-shrink: 0; }
.tip-card .tip-text { font-size: 1.05rem; color: var(--text-dark); line-height: 1.6; }
.tip-card .tip-extra { display: none; font-size: 0.9rem; color: var(--text-light); margin-top: 6px; line-height: 1.5; }
.tip-card.expand .tip-extra { display: block; }
.tip-card .tip-expand { font-size: 0.85rem; color: var(--pink-dark); cursor: pointer; margin-top: 4px; display: inline-block; }
.tip-quote { text-align: center; font-family: 'KaiTi', 'STKaiti', 'SimSun', serif; font-size: 1.15rem; color: var(--text-light); font-style: italic; padding: 10px 20px; opacity: 0; transform: translateX(10px); transition: all 0.3s; }
.tip-quote.visible { opacity: 1; transform: translateX(0); }
.tip-refresh { display: block; margin: 20px auto 0; background: linear-gradient(135deg,var(--pink-dark),var(--pink-deep)); color: #fff; border: none; border-radius: 25px; padding: 10px 28px; font-size: 0.95rem; cursor: pointer; }
.tip-refresh:hover { opacity: 0.9; }

/* ============ 时间线 ============ */
.timeline { position: relative; padding: 20px 0; }
.timeline::before { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 3px; background: linear-gradient(to bottom, var(--pink-light), var(--pink-dark), var(--pink-light)); transform: translateX(-50%); }
.timeline-item { position: relative; width: 45%; margin-bottom: 40px; background: rgba(255,255,255,0.85); border-radius: 18px; padding: 24px; box-shadow: var(--shadow-sm); opacity: 0; transform: translateY(30px); transition: all 0.6s ease; }
.timeline-item.visible { opacity: 1; transform: translateY(0); }
.timeline-item:nth-child(odd) { margin-left: 5%; }
.timeline-item:nth-child(even) { margin-left: 50%; }
.timeline-dot { position: absolute; top: 28px; width: 16px; height: 16px; background: var(--pink-dark); border: 3px solid var(--white); border-radius: 50%; z-index: 2; }
.timeline-item:nth-child(odd) .timeline-dot { right: -34px; }
.timeline-item:nth-child(even) .timeline-dot { left: -34px; }
.timeline-date { font-family: 'KaiTi', 'STKaiti', 'SimSun', serif; font-size: 1.2rem; color: var(--pink-deep); margin-bottom: 6px; }
.timeline-title { font-size: 1.2rem; color: var(--text-dark); font-weight: 700; margin-bottom: 6px; }
.timeline-desc { font-size: 0.95rem; color: var(--text-light); line-height: 1.6; }
.timeline-photo { width: 100%; border-radius: 12px; margin-top: 10px; cursor: pointer; object-fit: cover; max-height: 200px; }

/* ============ 相册 ============ */
.gallery-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 24px; }
.polaroid { background: var(--white); border-radius: 16px; padding: 12px; box-shadow: var(--shadow-sm); transform: rotate(-1deg); transition: all 0.3s; cursor: pointer; opacity: 0; transform: translateY(30px); }
.polaroid.visible { opacity: 1; transform: translateY(0); }
.polaroid:nth-child(even) { transform: rotate(1deg); }
.polaroid:hover { transform: rotate(0) scale(1.03); box-shadow: var(--shadow); }
.polaroid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; display: block; background: #f5f5f5; }
.polaroid .photo-caption { font-size: 0.9rem; color: var(--text-light); text-align: center; margin-top: 8px; min-height: 20px; outline: none; }
.polaroid .photo-date { font-size: 0.75rem; color: #bbb; text-align: center; }
.upload-btn { background: rgba(255,255,255,0.5); border: 2px dashed var(--pink-mid); border-radius: 16px; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; transition: all 0.3s; min-height: 200px; font-size: 2rem; color: var(--pink-mid); }
.upload-btn:hover { background: rgba(255,255,255,0.8); border-color: var(--pink-dark); color: var(--pink-dark); }
.upload-btn span { font-size: 0.85rem; margin-top: 6px; }
.upload-input { display: none; }

/* ============ 倒计时 ============ */
.countdown-boxes { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-bottom: 30px; }
.countdown-box { background: rgba(255,255,255,0.85); border-radius: 18px; padding: 20px 28px; text-align: center; box-shadow: var(--shadow-sm); min-width: 90px; }
.countdown-label { font-family: 'KaiTi', 'STKaiti', 'SimSun', serif; font-size: 1.6rem; color: var(--pink-dark); margin-bottom: 6px; }
.countdown-target { font-family: 'KaiTi', 'STKaiti', 'SimSun', serif; font-size: 1.7rem; color: var(--text-dark); margin-bottom: 20px; }
.countdown-inputs { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
.countdown-inputs input { padding: 10px 14px; border: 2px solid var(--pink-light); border-radius: 12px; font-size: 1rem; background: var(--white); color: var(--text-dark); outline: none; }
.countdown-inputs input:focus { border-color: var(--pink-dark); }
.countdown-number { font-family: 'KaiTi', 'STKaiti', 'SimSun', serif; font-size: 3.2rem; color: var(--pink-deep); line-height: 1; }
.countdown-unit { font-size: 0.85rem; color: var(--text-light); }
.together-quote { margin-top: 20px; font-family: 'KaiTi', 'STKaiti', 'SimSun', serif; font-size: 1.15rem; color: var(--text-light); opacity: 0.8; }

/* ============ 日记 ============ */
.diary-form { background: rgba(255,255,255,0.85); border-radius: 18px; padding: 24px; box-shadow: var(--shadow-sm); margin-bottom: 20px; }
.diary-form label { font-size: 0.9rem; color: var(--text-light); margin-bottom: 4px; display: block; }
.diary-form input, .diary-form textarea { width: 100%; padding: 12px 16px; border: 2px solid var(--pink-light); border-radius: 12px;
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'SimSun', sans-serif; font-size: 1.05rem; color: var(--text-dark); background: var(--white); outline: none; transition: border-color 0.3s; margin-bottom: 10px; }
.diary-form input:focus, .diary-form textarea:focus { border-color: var(--pink-dark); }
.diary-form textarea { min-height: 100px; resize: vertical; }
.mood-selector { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.mood-btn { background: var(--white); border: 2px solid var(--pink-light); border-radius: 20px; padding: 6px 14px; font-size: 0.9rem; cursor: pointer; transition: all 0.3s; }
.mood-btn.selected { border-color: var(--pink-dark); background: var(--pink-light); }
.diary-actions { display: flex; gap: 10px; justify-content: flex-end; }
.diary-actions button { padding: 10px 24px; border: none; border-radius: 20px; font-size: 0.95rem; cursor: pointer; transition: all 0.3s; }
.diary-save { background: linear-gradient(135deg,var(--pink-dark),var(--pink-deep)); color: var(--white); }
.diary-save:hover { opacity: 0.9; }
.diary-list { display: grid; gap: 16px; }
.diary-card { background: rgba(255,255,255,0.85); border-radius: 16px; padding: 20px; box-shadow: var(--shadow-sm); position: relative; }
.diary-card .diary-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.diary-card .diary-date { font-size: 0.9rem; color: var(--text-light); }
.diary-card .diary-mood { font-size: 1.3rem; }
.diary-card .diary-content { font-size: 1rem; color: var(--text-dark); line-height: 1.6; }
.diary-card .diary-del { position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 1rem; color: #ccc; cursor: pointer; }
.diary-card .diary-del:hover { color: #e53935; }

/* ============ 梦想 ============ */
.dream-dual { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.dream-col { background: rgba(255,255,255,0.85); border-radius: 18px; padding: 24px; box-shadow: var(--shadow-sm); }
.dream-col-title { font-family: 'KaiTi', 'STKaiti', 'SimSun', serif; font-size: 1.7rem; text-align: center; margin-bottom: 12px; }
.dream-col h3.his { color: var(--pink-dark); }
.dream-col h3.hers { color: #a18cd1; }
.dream-form { display: flex; gap: 8px; margin-bottom: 14px; }
.dream-form input { flex: 1; padding: 10px 14px; border: 2px solid var(--pink-light); border-radius: 12px; font-size: 0.95rem; color: var(--text-dark); background: var(--white); outline: none; }
.dream-form input:focus { border-color: var(--pink-dark); }
.dream-form button { background: linear-gradient(135deg,var(--pink-dark),var(--pink-deep)); color: var(--white); border: none; border-radius: 12px; padding: 10px 16px; font-size: 1rem; cursor: pointer; }
.dream-list { list-style: none; }
.dream-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f5f5f5; }
.dream-item input[type="checkbox"] { accent-color: var(--pink-dark); width: 18px; height: 18px; }
.dream-item span { font-size: 1rem; color: var(--text-dark); flex: 1; }
.dream-item span.done { text-decoration: line-through; color: #bbb; }
.dream-item .dream-del { background: none; border: none; font-size: 0.9rem; color: #ccc; cursor: pointer; }
.dream-item .dream-del:hover { color: #e53935; }
.dream-progress { text-align: center; margin-top: 14px; font-size: 0.9rem; color: var(--text-light); }

/* ============ 爱好 ============ */
.hobby-dual { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.hobby-col { background: rgba(255,255,255,0.85); border-radius: 18px; padding: 24px; box-shadow: var(--shadow-sm); }
.hobby-col-title { font-family: 'KaiTi', 'STKaiti', 'SimSun', serif; font-size: 1.7rem; text-align: center; margin-bottom: 12px; }
.hobby-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px,1fr)); gap: 12px; }
.hobby-item { background: var(--cream); border-radius: 14px; padding: 14px; text-align: center; transition: all 0.3s; position: relative; }
.hobby-item:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.hobby-item .hobby-icon { font-size: 2rem; margin-bottom: 6px; }
.hobby-item .hobby-name { font-size: 0.95rem; color: var(--text-dark); }
.hobby-item .hobby-del { position: absolute; top: 4px; right: 8px; background: none; border: none; font-size: 0.8rem; color: #ccc; cursor: pointer; }
.hobby-item .hobby-del:hover { color: #e53935; }
.hobby-form { display: flex; gap: 8px; margin-top: 12px; }
.hobby-form input { flex: 1; padding: 10px 14px; border: 2px solid var(--pink-light); border-radius: 12px; font-size: 0.95rem; color: var(--text-dark); background: var(--white); outline: none; }
.hobby-form input:focus { border-color: var(--pink-dark); }
.hobby-form button { background: linear-gradient(135deg,var(--pink-dark),var(--pink-deep)); color: var(--white); border: none; border-radius: 12px; padding: 10px 16px; font-size: 1rem; cursor: pointer; }

/* ============ 经期 ============ */
.period-card { background: rgba(255,255,255,0.85); border-radius: 18px; padding: 24px; box-shadow: var(--shadow-sm); text-align: center; margin-bottom: 14px; }
.period-card .p-label { font-size: 0.9rem; color: var(--text-light); }
.period-card .p-value { font-family: 'KaiTi', 'STKaiti', 'SimSun', serif; font-size: 1.8rem; color: var(--pink-deep); }
.period-card .p-sub { font-size: 0.8rem; color: var(--text-light); margin-top: 4px; }
.period-info { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
.period-cal { width: 100%; border-collapse: collapse; margin-top: 14px; }
.period-cal th { font-size: 0.9rem; color: var(--text-light); padding: 8px 4px; font-weight: 400; }
.period-cal td { text-align: center; padding: 8px 4px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; transition: all 0.2s; }
.period-cal td:hover { background: var(--pink-light); }
.period-cal td.today { background: var(--pink-dark); color: var(--white); font-weight: 700; border-radius: 50%; }
.period-cal td.period-day { background: #fce4ec; color: var(--pink-deep); }
.period-cal td.predict { background: #fff3e0; color: #e65100; }
.period-cal td.empty { visibility: hidden; }

/* ============ 留言板 ============ */
.guestbook-form { background: rgba(255,255,255,0.85); border-radius: 18px; padding: 24px; box-shadow: var(--shadow-sm); margin-bottom: 20px; }

<body>

    <!-- 登录页 -->

            <input type="text" id="loginCode" placeholder="邀请码" maxlength="50" autocomplete="off" style="width:100%;padding:14px 18px;border:2px solid #ffe4ec;border-radius:14px;font-size:1.05rem;color:#5a3e4b;background:#fff;outline:none;margin-bottom:14px;display:block;">

<script>
// ============ 登录 & 存储隔离 ============
var storagePrefix = '';
function lsGet(key){ return localStorage.getItem(storagePrefix + key); }
function lsSet(key, val){ localStorage.setItem(storagePrefix + key, val); }

var _vc=['zhangandcheng'];
function _ck(c){return _vc.indexOf(c)!==-1;}

function doLogin(){
    var user = document.getElementById('loginUser').value.trim();
    var pass = document.getElementById('loginPass').value.trim();
    var code = document.getElementById('loginCode').value.trim();
    if(!user){ document.getElementById('loginError').textContent='请输入你的名字'; return; }
    if(!pass){ document.getElementById('loginError').textContent='请输入房间密码'; return; }
    if(!code){ document.getElementById('loginError').textContent='请输入邀请码'; return; }
    if(!_ck(code)){ document.getElementById('loginError').textContent='邀请码无效，请联系管理员'; return; }
    storagePrefix = 'love_data_' + pass + '_';
    localStorage.setItem('lastLoginUser', user);
    localStorage.setItem('lastLoginPass', pass);
    localStorage.setItem('lastLoginCode', code);
    document.getElementById('login-page').style.display='none';
    document.getElementById('main-page').style.display='block';
    document.getElementById('loading-screen').classList.remove('hidden');
    setTimeout(function(){ document.getElementById('loading-screen').classList.add('hidden'); }, 1800);
}

function doLogout(){
    storagePrefix = '';
    document.getElementById('main-page').style.display='none';
    document.getElementById('login-page').style.display='flex';
    document.getElementById('loginError').textContent='';
}

// ============ 找回账号 ============
function openRecover(){ document.getElementById('recoverModal').classList.add('show'); }
function closeRecover(){ document.getElementById('recoverModal').classList.remove('show'); }

// ============ 自动登录 ============
(function(){
    try {
        var lastUser = localStorage.getItem('lastLoginUser');
        var lastPass = localStorage.getItem('lastLoginPass');
        var lastCode = localStorage.getItem('lastLoginCode');
        if(lastUser) document.getElementById('loginUser').value = lastUser;
        if(lastPass) document.getElementById('loginPass').value = lastPass;
        if(lastCode) document.getElementById('loginCode').value = lastCode;
        if(lastUser && lastPass && lastCode && _ck(lastCode)){
            storagePrefix = 'love_data_' + lastPass + '_';
            document.getElementById('login-page').style.display='none';
            document.getElementById('main-page').style.display='block';
            setTimeout(function(){ document.getElementById('loading-screen').classList.add('hidden'); }, 1800);
        }
    } catch(e) {
        localStorage.removeItem('lastLoginUser');
        localStorage.removeItem('lastLoginPass');
        localStorage.removeItem('lastLoginCode');
        document.getElementById('login-page').style.display='flex';
        document.getElementById('main-page').style.display='none';
    }
})();
</script>
