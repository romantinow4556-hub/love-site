<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我们的故事</title>
</head>
<body style="margin:0;padding:0;background:linear-gradient(135deg,#fff0f5,#ffe0eb,#ffd1dc,#ffe4ec);min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:'PingFang SC','Microsoft YaHei','Hiragino Sans GB','SimSun',sans-serif;">
<div style="background:#fff;border-radius:24px;padding:48px 40px;max-width:420px;width:100%;text-align:center;box-shadow:0 8px 40px rgba(233,30,140,0.15);">
<div style="font-size:4rem;margin-bottom:12px;">💕</div>
<h2 style="font-size:2.2rem;color:#e91e8c;margin-bottom:6px;">我们的小屋</h2>
<div style="font-size:1.1rem;color:#8b6f7e;margin-bottom:28px;">Enter our love space</div>
<input type="text" placeholder="你的名字" style="width:100%;padding:14px 18px;border:2px solid #ffe4ec;border-radius:14px;font-size:1.05rem;color:#5a3e4b;background:#fff;outline:none;margin-bottom:14px;box-sizing:border-box;">
<input type="password" placeholder="房间密码" style="width:100%;padding:14px 18px;border:2px solid #ffe4ec;border-radius:14px;font-size:1.05rem;color:#5a3e4b;background:#fff;outline:none;margin-bottom:14px;box-sizing:border-box;">
<input type="text" placeholder="邀请码" style="width:100%;padding:14px 18px;border:2px solid #ffe4ec;border-radius:14px;font-size:1.05rem;color:#5a3e4b;background:#fff;outline:none;margin-bottom:14px;box-sizing:border-box;">
<button style="width:100%;padding:14px;border:none;border-radius:25px;background:linear-gradient(135deg,#ff69b4,#e91e8c);color:#fff;font-size:1.1rem;font-weight:700;cursor:pointer;margin-top:6px;">💕 进入我们的小屋</button>
<div style="margin-top:18px;font-size:0.85rem;color:#8b6f7e;">💡 输入邀请码和房间密码，开启属于你们的空间</div>
</div>
</body>
</html>
