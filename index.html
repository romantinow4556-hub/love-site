<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>我们的故事 💕</title>
    <style>
        /* ============ 基础样式 & 重置 ============ */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --pink-light: #ffe4ec; --pink-mid: #ffb6c1; --pink-dark: #ff69b4;
            --pink-deep: #e91e8c; --gold: #d4a857; --cream: #fff8f0;
            --text-dark: #5a3e4b; --text-light: #8b6f7e; --white: #fff;
            --shadow: 0 4px 20px rgba(233,30,140,0.15);
            --shadow-sm: 0 2px 12px rgba(0,0,0,0.06);
            --radius: 16px;
        }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'SimSun', sans-serif;
            background: linear-gradient(180deg, #fff0f5, #ffe4ec, #ffd6e0, #ffe4ec, #fff0f5);
            color: var(--text-dark); overflow-x: hidden; min-height: 100vh;
        }

        /* ============ Loading ============ */
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #fff0f5, #ffe0eb, #ffd1dc);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10000; transition: opacity 0.8s, visibility 0.8s;
        }
        #loading-screen.hidden { opacity: 0; visibility: hidden; }
        #loading-screen .loading-text { font-family: 'KaiTi', 'STKaiti', 'SimSun', serif; font-size: 2.5rem; color: var(--pink-dark); margin-bottom: 30px; animation: pulse 1.5s ease-in-out infinite; }
        #loading-screen .loading-hearts { display: flex; gap: 12px; }
        #loading-screen .loading-hearts span { font-size: 1.8rem; animation: heartBounce 1.4s ease-in-out infinite; }
        #loading-screen .loading-hearts span:nth-child(2) { animation-delay: 0.2s; }
        #loading-screen .loading-hearts span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes heartBounce { 0%,80%,100%{transform:scale(1) translateY(0)} 40%{transform:scale(1.3) translateY(-15px)} }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

        /* ============ 鼠标跟随 & 飘落 ============ */
        .cursor-heart { position: fixed; pointer-events: none; font-size: 1rem; z-index: 9999; animation: cursorFade 1s ease-out forwards; }
        @keyframes cursorFade { 0%{opacity:1;transform:translate(0,0) scale(1) rotate(0)} 100%{opacity:0;transform:translate(0,-60px) scale(0.3) rotate(45deg)} }
        .falling-petal { position: fixed; top: -40px; pointer-events: none; z-index: 2; animation: petalFall linear forwards; font-size: 1.2rem; }
        @keyframes petalFall { 0%{opacity:1;transform:translateY(0) rotate(0) translateX(0)} 25%{transform:translateY(25vh) rotate(90deg) translateX(30px)} 50%{transform:translateY(50vh) rotate(180deg) translateX(-20px)} 75%{transform:translateY(75vh) rotate(270deg) translateX(25px)} 100%{opacity:0.3;transform:translateY(105vh) rotate(360deg) translateX(-10px)} }

        /* ============ 导航栏 ============ */
        nav {
            position: fixed; top: 0; left: 0; width: 100%; padding: 12px 20px;
            background: rgba(255,240,245,0.9); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            z-index: 1000; display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 2px 15px rgba(233,30,140,0.08); transition: transform 0.3s;
        }
        nav .nav-logo { font-family: 'KaiTi', 'STKaiti', 'SimSun', serif; font-size: 1.5rem; color: var(--pink-deep); text-decoration: none; white-space: nowrap; }
        nav .nav-links { display: flex; gap: 6px; list-style: none; flex-wrap: wrap; justify-content: center; }
        nav .nav-links a {
            text-decoration: none; font-size: 0.9rem; padding: 6px 12px; border-radius: 20px;
            font-weight: 600; transition: all 0.3s; white-space: nowrap;
        }
        nav .nav-links a:hover { transform: translateY(-1px) scale(1.05); }
        .nav-story { background: linear-gradient(135deg,#ff9a9e,#fad0c4); color: #7a3b2e; box-shadow: 0 2px 8px rgba(255,154,158,0.3); }
        .nav-gallery { background: linear-gradient(135deg,#a18cd1,#fbc2eb); color: #4a2d6b; box-shadow: 0 2px 8px rgba(161,140,209,0.3); }
        .nav-countdown { background: linear-gradient(135deg,#f6d365,#fda085); color: #7a4a1e; box-shadow: 0 2px 8px rgba(253,160,133,0.3); }
        .nav-diary { background: linear-gradient(135deg,#84fab0,#8fd3f4); color: #1a5c4a; box-shadow: 0 2px 8px rgba(132,250,176,0.3); }
        .nav-dream { background: linear-gradient(135deg,#c3cfe2,#f5f7fa); color: #4a5568; box-shadow: 0 2px 8px rgba(195,207,226,0.3); }
        .nav-hobby { background: linear-gradient(135deg,#ffecd2,#fcb69f); color: #7a4a1e; box-shadow: 0 2px 8px rgba(252,182,159,0.3); }
        .nav-period { background: linear-gradient(135deg,#fbc2eb,#e8b4f8); color: #6b21a8; box-shadow: 0 2px 8px rgba(232,180,248,0.3); }
        .nav-guest { background: linear-gradient(135deg,#d4fc79,#96e6a1); color: #1a5c3a; box-shadow: 0 2px 8px rgba(150,230,161,0.3); }
        .nav-logout { background: linear-gradient(135deg,#e0e0e0,#bdbdbd); color: #555; box-shadow: 0 2px 8px rgba(189,189,189,0.3); }
        .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; background: none; border: none; padding: 5px; }
        .hamburger span { display: block; width: 25px; height: 2.5px; background: var(--pink-deep); border-radius: 2px; transition: all 0.3s; }

        /* ============ 通用 Section ============ */
        .section { padding: 80px 16px; max-width: 1000px; margin: 0 auto; }
        .section-title { text-align: center; font-family: 'KaiTi', 'STKaiti', 'SimSun', serif; font-size: 3rem; color: var(--pink-deep); margin-bottom: 10px; }
        .section-subtitle { text-align: center; font-family: 'KaiTi', 'STKaiti', 'SimSun', serif; font-size: 1.3rem; color: var(--text-light); margin-bottom: 40px; }

        /* ============ 卡片通用 ============ */
        .card {
            background: rgba(255,255,255,0.85); backdrop-filter: blur(8px);
            border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow-sm);
            transition: all 0.3s;
        }
        .card:hover { box-shadow: var(--shadow); transform: translateY(-2px); }

        /* ============ Hero ============ */
        .hero {
            min-height: 100vh; display: flex; flex-direction: column; justify-content: center;
            align-items: center; text-align: center; padding: 100px 20px 60px; position: relative;
        }
        .hero-decoration { position: absolute; font-size: 15rem; opacity: 0.04; color: var(--pink-deep); top: 50%; left: 50%; transform: translate(-50%,-50%); pointer-events: none; }
        .hero .subtitle-top { font-family: 'KaiTi', 'STKaiti', 'SimSun', serif; font-size: 1.6rem; color: var(--pink-dark); margin-bottom: 10px; letter-spacing: 2px; }
        .hero h1 { font-family: 'KaiTi', 'STKaiti', 'SimSun', serif; font-size: 4.8rem; color: var(--pink-deep); margin-bottom: 15px; text-shadow: 0 2px 10px rgba(233,30,140,0.2); }
        .hero .couple-names { font-family: 'KaiTi', 'STKaiti', 'SimSun', serif; font-size: 2.6rem; color: var(--gold); margin-bottom: 20px; }
        .hero .date-line { font-size: 1.25rem; color: var(--text-light); letter-spacing: 3px; margin-bottom: 30px; }
        .hero .scroll-hint { margin-top: 40px; animation: bounce 2s infinite; color: var(--pink-dark); font-size: 1.8rem; cursor: pointer; }
        @keyframes bounce { 0%,20%,50%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-12px)} 60%{transform:translateY(-6px)} }

        /* ============ 仪表盘 ============ */
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .dash-date-card { grid-column: 1 / -1; text-align: center; padding: 30px; }
        .dash-date-card .today-date { font-family: 'KaiTi', 'STKaiti', 'SimSun', serif; font-size: 2.4rem; color: var(--pink-deep); }
        .dash-date-card .today-weekday { font-size: 1.15rem; color: var(--text-light); margin-top: 4px; }
        .dash-quote { font-style: italic; color: var(--text-dark); font-size: 1.2rem; line-height: 1.8; min-height: 60px; }
        .dash-quote-author { text-align: right; font-size: 1rem; color: var(--text-light); margin-top: 8px; }
        .dash-next-anniv { text-align: center; }
        .dash-next-anniv .anniv-label { font-size: 1.05rem; color: var(--text-light); margin-bottom: 6px; }
        .dash-next-anniv .anniv-days { font-family: 'KaiTi', 'STKaiti', 'SimSun', serif; font-size: 3.5rem; color: var(--pink-deep); line-height: 1; }
        .dash-next-anniv .anniv-unit { font-size: 1.05rem; color: var(--text-light); }
        .dash-next-anniv input[type="date"] { margin-top: 10px; padding: 6px 10px; border: 2px solid var(--pink-mid); border-radius: 10px; font-size: 1rem; color: var(--pink-deep); background: var(--white); outline: none; }
        .quick-note-area { grid-column: 1 / -1; }
        .quick-note-area textarea {
            width: 100%; height: 70px; padding: 12px; border: 2px solid var(--pink-light); border-radius: 12px;
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'SimSun', sans-serif; font-size: 1.1rem; color: var(--text-dark);
            background: var(--white); outline: none; resize: vertical; transition: border-color 0.3s;
        }
        .quick-note-area textarea:focus { border-color: var(--pink-dark); }
        .quick-note-area button {
            margin-top: 8px; background: linear-gradient(135deg,var(--pink-dark),var(--pink-deep)); color: var(--white);
            border: none; padding: 10px 28px; border-radius: 25px; font-size: 1.1rem;
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'SimSun', sans-serif; cursor: pointer; transition: all 0.3s; box-shadow: 0 3px 12px rgba(233,30,140,0.3);
        }
        .quick-note-area button:hover { transform: translateY(-2px); box-shadow: 0 5px 18px rgba(233,30,140,0.4); }
        .qn-card { background: rgba(255,240,245,0.6); border-radius: 12px; padding: 10px 14px; margin-bottom: 8px; position: relative; animation: messageIn 0.4s ease; }
        .qn-card .qn-date { font-size: 0.85rem; color: var(--text-light); margin-bottom: 3px; }
        .qn-card .qn-text { font-size: 1.05rem; color: var(--text-dark); line-height: 1.6; }
        .qn-del { position: absolute; top: 8px; right: 10px; background: none; border: none; font-size: 1rem; color: #ccc; cursor: pointer; transition: all 0.2s; padding: 0 4px; border-radius: 4px; }
        .qn-del:hover { color: #e91e8c; background: rgba(233,30,140,0.08); }

        /* ============ 音乐播放器 ============ */
        .music-player { position: fixed; bottom: 24px; right: 24px; z-index: 999; display: flex; align-items: center; gap: 8px; }
        .music-btn {
            width: 50px; height: 50px; border-radius: 50%; border: none;
            background: linear-gradient(135deg,var(--pink-dark),var(--pink-deep)); color: var(--white);
            font-size: 1.3rem; cursor: pointer; box-shadow: 0 4px 20px rgba(233,30,140,0.4);
            transition: all 0.3s; display: flex; align-items: center; justify-content: center;
        }
        .music-btn:hover { transform: scale(1.1); }
        .music-btn.playing { animation: musicPulse 1.5s ease-in-out infinite; }
        @keyframes musicPulse { 0%,100%{box-shadow:0 4px 20px rgba(233,30,140,0.4)} 50%{box-shadow:0 4px 30px rgba(233,30,140,0.7),0 0 0 8px rgba(233,30,140,0.1)} }
        .music-info {
            background: rgba(255,255,255,0.9); backdrop-filter: blur(8px); padding: 6px 14px;
            border-radius: 18px; font-size: 0.85rem; color: var(--text-light); box-shadow: var(--shadow-sm);
            white-space: nowrap; opacity: 0; transform: translateX(10px); transition: all 0.3s;
        }
        .music-player:hover .music-info { opacity: 1; transform: translateX(0); }
        .music-upload-label {
            width: 32px; height: 32px; border-radius: 50%; border: 2px dashed var(--pink-mid);
            background: rgba(255,255,255,0.9); color: var(--pink-dark); font-size: 0.9rem;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.3s; box-shadow: 0 2px 8px rgba(233,30,140,0.2);
        }
        .music-upload-label:hover { border-style: solid; background: var(--pink-light); transform: scale(1.1); }

        /* ============ 时间线 ============ */
        .timeline { position: relative; padding: 20px 0; }
        .timeline::before { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 3px; background: linear-gradient(to bottom,transparent,var(--pink-mid),var(--pink-dark),var(--pink-mid),transparent); transform: translateX(-50%); }
        .timeline-item {
            position: relative; width: 45%; padding: 28px; margin-bottom: 40px;
            background: rgba(255,255,255,0.8); backdrop-filter: blur(8px);
            border-radius: 20px; box-shadow: var(--shadow); transition: all 0.4s;
            opacity: 0; transform: translateY(30px);
        }
        .timeline-item.visible { opacity: 1; transform: translateY(0); }
        .timeline-item:hover { transform: translateY(-5px); box-shadow: 0 8px 30px rgba(233,30,140,0.25); }
        .timeline-item:nth-child(odd) { margin-left: 5%; }
        .timeline-item:nth-child(even) { margin-left: 50%; }
        .timeline-dot {
            position: absolute; top: 35px; width: 18px; height: 18px;
            background: var(--pink-dark); border: 3px solid var(--white);
            border-radius: 50%; box-shadow: 0 0 0 4px rgba(255,105,180,0.3); z-index: 1;
        }
        .timeline-item:nth-child(odd) .timeline-dot { right: -34px; }
        .timeline-item:nth-child(even) .timeline-dot { left: -34px; }
        .timeline-emoji { font-size: 2rem; margin-bottom: 10px; }
        .timeline-date { font-family: 'KaiTi', 'STKaiti', 'SimSun', serif; font-size: 1.2rem; color: var(--pink-deep); margin-bottom: 6px; }
        .timeline-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; }
        .timeline-desc { font-size: 1.05rem; color: var(--text-light); line-height: 1.8; }
        .timeline-date[contenteditable="true"]:hover, .timeline-title[contenteditable="true"]:hover, .timeline-desc[contenteditable="true"]:hover { background: rgba(255,105,180,0.06); border-radius: 8px; }
        .timeline-date[contenteditable="true"]:focus, .timeline-title[contenteditable="true"]:focus, .timeline-desc[contenteditable="true"]:focus { outline: 2px dashed var(--pink-mid); outline-offset: 4px; background: rgba(255,105,180,0.04); border-radius: 8px; }
        .timeline-edit-hint { text-align: center; font-size: 1rem; color: var(--pink-mid); margin-bottom: 15px; }
        .timeline-photo { width: 100%; height: 170px; object-fit: cover; border-radius: 12px; margin-top: 12px; cursor: pointer; transition: filter 0.3s; }
        .timeline-photo:hover { filter: brightness(0.7); }
        .timeline-photo-wrap { position: relative; margin-top: 12px; }
        .timeline-photo-wrap .upload-hint {
            position: absolute; top: 0; left: 0; right: 0; bottom: 40px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.35); color: var(--white); font-size: 1.05rem;
            border-radius: 2px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 5;
        }
        .timeline-photo-wrap:hover .upload-hint { opacity: 1; }

        /* ============ 拍立得画廊 ============ */
        .gallery-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 28px; padding: 10px; }
        .polaroid {
            background: var(--white); padding: 10px 10px 45px; border-radius: 4px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1); transition: all 0.4s;
            cursor: pointer; position: relative; opacity: 0; transform: translateY(30px);
        }
        .polaroid.visible { opacity: 1; transform: translateY(0); }
        .polaroid:nth-child(1).visible { transform: rotate(-3deg); }
        .polaroid:nth-child(2).visible { transform: rotate(2deg); }
        .polaroid:nth-child(3).visible { transform: rotate(-1deg); }
        .polaroid:nth-child(4).visible { transform: rotate(3deg); }
        .polaroid:nth-child(5).visible { transform: rotate(-2deg); }
        .polaroid:nth-child(6).visible { transform: rotate(1deg); }
        .polaroid:hover { transform: rotate(0deg) scale(1.05) !important; box-shadow: 0 12px 35px rgba(0,0,0,0.15); z-index: 10; }
        .polaroid img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 2px; display: block; }
        .polaroid-caption {
            position: absolute; bottom: 10px; left: 0; right: 0; text-align: center;
            font-family: 'KaiTi', 'STKaiti', 'SimSun', serif; font-size: 1.15rem; color: var(--text-light);
        }
        .polaroid-upload-btn {
            position: absolute; bottom: 6px; right: 6px; z-index: 10;
            font-size: 0.65rem; color: var(--text-light); background: rgba(255,255,255,0.85);
            border: 1px dashed var(--pink-mid); border-radius: 8px; padding: 2px 8px;
            cursor: pointer; transition: all 0.2s; opacity: 0;
        }
        .polaroid:hover .polaroid-upload-btn { opacity: 1; }
        .polaroid-upload-btn:hover { background: var(--pink-light); color: var(--pink-deep); border-style: solid; }

        /* ============ 灯箱浏览 ============ */
        .lightbox {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92); z-index: 10002; display: flex;
            justify-content: center; align-items: center; flex-direction: column;
            opacity: 0; visibility: hidden; transition: all 0.4s;
        }
        .lightbox.show { opacity: 1; visibility: visible; }
        .lightbox-img {
            max-width: 90vw; max-height: 80vh; object-fit: contain;
            border-radius: 8px; box-shadow: 0 8px 40px rgba(0,0,0,0.5);
            transition: opacity 0.5s;
        }
        .lightbox-close {
            position: absolute; top: 20px; right: 30px; font-size: 2.2rem;
            color: rgba(255,255,255,0.8); cursor: pointer; background: none;
            border: none; transition: all 0.2s; z-index: 10;
        }
        .lightbox-close:hover { color: #fff; transform: scale(1.2); }
        .lightbox-nav {
            position: absolute; top: 50%; transform: translateY(-50%);
            font-size: 2.5rem; color: rgba(255,255,255,0.7); cursor: pointer;
            background: rgba(255,255,255,0.1); border: none; border-radius: 50%;
            width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .lightbox-nav:hover { color: #fff; background: rgba(255,255,255,0.2); }
        .lightbox-prev { left: 20px; }
        .lightbox-next { right: 20px; }
        .lightbox-caption {
            margin-top: 16px; font-family: 'KaiTi', 'STKaiti', 'SimSun', serif;
            font-size: 1.3rem; color: rgba(255,255,255,0.8);
        }
        .lightbox-counter {
            margin-top: 6px; font-size: 0.85rem; color: rgba(255,255,255,0.5);
        }
        .lightbox-autoplay {
            margin-top: 12px; font-size: 0.8rem; color: rgba(255,255,255,0.4);
            cursor: pointer; background: none; border: 1px solid rgba(255,255,255,0.2);
            border-radius: 14px; padding: 4px 14px; transition: all 0.2s;
        }
        .lightbox-autoplay:hover { border-color: rgba(255,255,255,0.5); color: rgba(255,255,255,0.7); }
        .lightbox-autoplay.active { border-color: var(--pink-dark); color: var(--pink-dark); }

        /* ============ 在一起计时 ============ */
        .countdown-section { text-align: center; background: linear-gradient(135deg,rgba(255,255,255,0.7),rgba(255,228,236,0.7)); backdrop-filter: blur(10px); border-radius: 30px; padding: 50px 24px; margin: 0 auto; max-width: 650px; box-shadow: var(--shadow); }
        .countdown-label { font-family: 'KaiTi', 'STKaiti', 'SimSun', serif; font-size: 1.6rem; color: var(--pink-dark); margin-bottom: 6px; }
        .countdown-target { font-family: 'KaiTi', 'STKaiti', 'SimSun', serif; font-size: 1.7rem; color: var(--text-dark); margin-bottom: 20px; }
        .date-edit-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px; font-size: 1.05rem; color: var(--text-light); }
        .date-edit-row input[type="date"] { padding: 7px 12px; border: 2px solid var(--pink-mid); border-radius: 10px; font-size: 1rem; color: var(--pink-deep); background: var(--white); outline: none; cursor: pointer; }
        .countdown-boxes { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; }
        .countdown-box { background: linear-gradient(135deg,#fff0f5,#ffe4ec); border: 2px solid rgba(255,105,180,0.2); border-radius: 14px; padding: 18px 24px; min-width: 90px; box-shadow: 0 3px 12px rgba(233,30,140,0.1); }
        .countdown-number { font-family: 'KaiTi', 'STKaiti', 'SimSun', serif; font-size: 3.2rem; color: var(--pink-deep); line-height: 1; }
        .countdown-unit { font-size: 1rem; color: var(--text-light); margin-top: 4px; }
        .together-quote { margin-top: 20px; font-family: 'KaiTi', 'STKaiti', 'SimSun', serif; font-size: 1.15rem; color: var(--text-light); opacity: 0.8; }

        /* ============ 通用列表/表单样式（日记/梦境/爱好） ============ */
        .data-form { background: rgba(255,255,255,0.85); backdrop-filter: blur(8px); border-radius: 20px; padding: 24px; box-shadow: var(--shadow-sm); margin-bottom: 24px; }
        .data-form .form-row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        .data-form input, .data-form textarea, .data-form select {
            flex: 1; min-width: 120px; padding: 10px 14px; border: 2px solid var(--pink-light);
            border-radius: 10px; font-family: 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'SimSun', sans-serif; font-size: 1.05rem;
            color: var(--text-dark); background: var(--white); outline: none; transition: border-color 0.3s;
        }
        .data-form input:focus, .data-form textarea:focus, .data-form select:focus { border-color: var(--pink-dark); }

        footer .footer-warning { margin-top: 12px; font-size: 0.9rem; color: #ccc; }

        /* ============ 彩蛋 ============ */
        .easter-egg-trigger { position: fixed; bottom: 8px; left: 8px; width: 20px; height: 20px; cursor: pointer; opacity: 0.15; transition: opacity 0.3s; z-index: 998; font-size: 14px; display: flex; align-items: center; justify-content: center; }
        .easter-egg-trigger:hover { opacity: 0.5; }
        .love-popup { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(233,30,140,0.15); backdrop-filter: blur(6px); display: flex; justify-content: center; align-items: center; z-index: 10001; opacity: 0; visibility: hidden; transition: all 0.5s; }
        .love-popup.show { opacity: 1; visibility: visible; }
        .love-popup-content { text-align: center; animation: popupScale 0.6s ease; }
        @keyframes popupScale { 0%{transform:scale(0.3);opacity:0} 50%{transform:scale(1.1)} 100%{transform:scale(1);opacity:1} }
        .love-popup-content .big-heart { font-size: 6rem; animation: heartBeat 1s ease-in-out infinite; }
        @keyframes heartBeat { 0%,100%{transform:scale(1)} 15%{transform:scale(1.15)} 30%{transform:scale(1)} 45%{transform:scale(1.15)} }
        .love-popup-content h2 { font-family: 'KaiTi', 'STKaiti', 'SimSun', serif; font-size: 3rem; color: var(--pink-deep); margin-top: 15px; }
        .love-popup-content p { color: var(--text-dark); margin-top: 10px; font-size: 1.1rem; }
        .love-popup .close-popup { margin-top: 20px; background: var(--white); border: 2px solid var(--pink-dark); color: var(--pink-deep); padding: 10px 28px; border-radius: 25px; font-size: 1rem; cursor: pointer; transition: all 0.3s; }
        .love-popup .close-popup:hover { background: var(--pink-dark); color: var(--white); }

        /* ============ 响应式 ============ */
        @media (max-width: 768px) {
            nav .nav-links {
                display: none; position: absolute; top: 100%; left: 0; width: 100%;
                background: rgba(255,240,245,0.97); backdrop-filter: blur(14px);
                flex-direction: column; padding: 10px 12px; gap: 6px;
                box-shadow: 0 8px 20px rgba(0,0,0,0.08); max-height: 70vh; overflow-y: auto;
            }
            nav .nav-links.open { display: flex; }
            nav .nav-links a { padding: 10px 16px; text-align: center; border-radius: 12px; margin: 0 8px; font-size: 0.95rem; }

            .hero h1 { font-size: 2.8rem; }
            .hero .couple-names { font-size: 1.6rem; }

            .period-info { grid-template-columns: 1fr; }

        }

            .hero h1 { font-size: 2.2rem; }
            .gallery-grid { grid-template-columns: 1fr; max-width: 260px; margin: 0 auto; }

        /* ============ 登录页 ============ */
        #login-page {
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            background: linear-gradient(135deg, #fff0f5, #ffe0eb, #ffd1dc, #ffe4ec);
            padding: 20px;

        }

        .login-card .login-hint { margin-top: 18px; font-size: 0.85rem; color: var(--text-light); }
        .login-error { color: #e53935; font-size: 0.9rem; margin-top: 8px; min-height: 20px; }
        .login-recover { margin-top: 10px; font-size: 0.85rem; }

        /* ============ 找回/绑定弹窗 ============ */
        .modal-overlay {

            padding: 20px;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: #fff; border-radius: 20px; padding: 32px 28px;
            width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto;
            box-shadow: 0 12px 40px rgba(0,0,0,0.2); animation: loginFadeIn 0.4s ease;

            font-family: 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'SimSun', sans-serif; font-size: 1rem; color: var(--text-dark);
            background: var(--white); outline: none; margin-bottom: 12px; transition: border-color 0.3s;

        /* 绑定页面 */
        .bind-section { max-width: 500px; margin: 0 auto; }

    </footer>

    </div><!-- /main-page -->


    <!-- ==================== JavaScript ==================== -->
    <script>
    var storagePrefix='';
    var _vc=['zhangandcheng'];
    function _ck(c){return _vc.indexOf(c)!==-1;}
    function lsGet(k){return localStorage.getItem(storagePrefix+k);}
    function lsSet(k,v){localStorage.setItem(storagePrefix+k,v);}

    function doLogin(){
        var user=document.getElementById('loginUser').value.trim();
        var pass=document.getElementById('loginPass').value.trim();
        var code=document.getElementById('loginCode').value.trim();
        if(!user){document.getElementById('loginError').textContent='请输入你的名字';return;}
        if(!pass){document.getElementById('loginError').textContent='请输入房间密码';return;}
        if(!code){document.getElementById('loginError').textContent='请输入邀请码';return;}
        if(!_ck(code)){document.getElementById('loginError').textContent='邀请码无效';return;}
        storagePrefix='love_data_'+pass+'_';
        localStorage.setItem('lastLoginUser',user);
        localStorage.setItem('lastLoginPass',pass);
        localStorage.setItem('lastLoginCode',code);
        document.getElementById('login-page').style.display='none';
        document.getElementById('main-page').style.display='block';
        document.getElementById('loading-screen').classList.remove('hidden');
        setTimeout(function(){document.getElementById('loading-screen').classList.add('hidden');},1800);
    }

    function doLogout(){
        storagePrefix='';
        document.getElementById('main-page').style.display='none';
        document.getElementById('login-page').style.display='flex';
    }

    function openRecover(){document.getElementById('recoverModal').classList.add('show');}
    function closeRecover(){document.getElementById('recoverModal').classList.remove('show');}

    // 自动登录
    try{
        var lu=localStorage.getItem('lastLoginUser');
        var lp=localStorage.getItem('lastLoginPass');
        var lc=localStorage.getItem('lastLoginCode');
        if(lu)document.getElementById('loginUser').value=lu;
        if(lp)document.getElementById('loginPass').value=lp;
        if(lc)document.getElementById('loginCode').value=lc;
        if(lu&&lp&&lc&&_ck(lc)){
            storagePrefix='love_data_'+lp+'_';
            document.getElementById('login-page').style.display='none';
            document.getElementById('main-page').style.display='block';
            document.getElementById('loading-screen').classList.remove('hidden');
            setTimeout(function(){document.getElementById('loading-screen').classList.add('hidden');},1800);
        }
    }catch(e){
        localStorage.removeItem('lastLoginUser');
        localStorage.removeItem('lastLoginPass');
        localStorage.removeItem('lastLoginCode');
    }
    </script>
</body>
</html>
